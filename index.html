<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>‹Aprende HTML/› — Tu profesor particular de programación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF9F4;
  --bg-dot: rgba(47,111,78,.10);
  --ink:#182620;
  --ink-soft:#5B6A61;
  --card:#FFFFFF;
  --line:#E7E3D6;
  --green:#2F6F4E;
  --green-deep:#173D2A;
  --green-bright:#48A672;
  --green-tint:#E9F3EC;
  --coral:#E4572E;
  --coral-deep:#B33F1E;
  --coral-tint:#FDEAE3;
  --blue:#3457D5;
  --blue-tint:#E9EDFC;
  --gold:#C9971F;
  --gold-tint:#FBF2DD;
  --radius:16px;
  --radius-sm:10px;
  --shadow: 0 1px 2px rgba(23,61,42,.04), 0 8px 24px -8px rgba(23,61,42,.14);
  --shadow-lift: 0 4px 8px rgba(23,61,42,.05), 0 18px 38px -14px rgba(23,61,42,.22);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 1.5px 1.5px, var(--bg-dot) 1.5px, transparent 0) 0 0/22px 22px,
    var(--bg);
  color:var(--ink);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces','Georgia',serif;
  font-weight:600;
  letter-spacing:-0.015em;
  margin:0 0 .5em 0;
  color:var(--ink);
}
code, pre, .mono, textarea.code-input{
  font-family:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
a{color:var(--blue);}
button{font-family:inherit;cursor:pointer;}
::selection{background:var(--green-tint);}
:focus-visible{outline:2.5px solid var(--green-bright);outline-offset:2px;border-radius:4px;}
@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important;} }

/* Layout shell */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:264px;flex-shrink:0;color:#EAF3ED;
  background:
    radial-gradient(620px 300px at 100% -10%, rgba(143,217,174,.18), transparent 60%),
    linear-gradient(175deg, var(--green-deep) 0%, #10281B 100%);
  padding:26px 18px;display:flex;flex-direction:column;gap:5px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar::-webkit-scrollbar{width:6px;}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:6px;}
.brand{
  font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#fff;
  margin-bottom:4px;letter-spacing:-.02em;display:flex;align-items:center;gap:2px;
}
.brand span{color:#8FD9AE;}
.brand-sub{font-size:11.5px;color:#8FB89E;margin-bottom:22px;letter-spacing:.01em;}
.nav-section{font-size:10px;text-transform:uppercase;font-weight:600;letter-spacing:.11em;color:#6F9C81;margin:16px 4px 6px 10px;}
.nav-item{
  display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
  color:#D6E9DD;text-decoration:none;font-size:13.5px;cursor:pointer;border:none;background:none;
  text-align:left;width:100%;transition:background .15s ease, transform .15s ease, color .15s ease;
}
.nav-item:hover{background:rgba(255,255,255,.08);transform:translateX(1px);}
.nav-item.active{background:linear-gradient(135deg,#8FD9AE,#6BC091);color:#0F2E1D;font-weight:700;box-shadow:0 4px 12px -4px rgba(0,0,0,.35);}
.nav-tag{font-family:'JetBrains Mono',monospace;font-size:11px;opacity:.7;}
.nav-item.active .nav-tag{opacity:1;}
.nav-check{margin-left:auto;font-size:11.5px;color:#8FD9AE;font-family:'JetBrains Mono',monospace;}
.nav-item.active .nav-check{color:#0F2E1D;}
.sidebar-progress{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#AFD4BE;}
.xp-bar-track{height:7px;border-radius:5px;background:rgba(255,255,255,.12);margin-top:7px;overflow:hidden;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#6BC091,#8FD9AE);border-radius:5px;transition:width .5s cubic-bezier(.4,0,.2,1);}

main{flex:1;min-width:0;padding:40px 46px 90px;max-width:1000px;}
@media (max-width:860px){
  #app{flex-direction:column;}
  .sidebar{width:100%;height:auto;position:relative;flex-direction:row;flex-wrap:wrap;padding:14px;background:linear-gradient(120deg,var(--green-deep),#10281B);}
  .brand,.brand-sub,.sidebar-progress{display:none;}
  .nav-section{display:none;}
  .nav-item{width:auto;}
  main{padding:22px 18px;}
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:var(--green-deep);
  background:var(--green-tint);display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:20px;
  margin-bottom:14px;border:1px solid rgba(47,111,78,.15);
}
.eyebrow::before{content:"●";color:var(--green-bright);font-size:8px;}
.lead{color:var(--ink-soft);font-size:16px;max-width:640px;}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 28px;
  margin-bottom:20px;box-shadow:var(--shadow);transition:box-shadow .2s ease, transform .2s ease;
}
.card:hover{box-shadow:var(--shadow-lift);}
.card h3{margin-top:0;}

.tag-chip{
  font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;background:var(--ink);color:#fff;
  padding:3px 9px;border-radius:7px;letter-spacing:-.01em;
}

/* Buttons */
.btn{border-radius:10px;padding:11px 20px;font-size:14px;font-weight:600;border:1px solid transparent;transition:transform .12s ease, box-shadow .12s ease, background .15s ease, border-color .15s ease;}
.btn-primary{background:linear-gradient(135deg,var(--green),var(--green-deep));color:#fff;box-shadow:0 3px 10px -3px rgba(23,61,42,.5);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px -4px rgba(23,61,42,.55);}
.btn-primary:active{transform:translateY(0);}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--green);color:var(--green-deep);transform:translateY(-1px);}
.btn-coral{background:linear-gradient(135deg,var(--coral),var(--coral-deep));color:#fff;}
.btn-coral:hover{transform:translateY(-1px);}
.btn-sm{padding:7px 13px;font-size:12.5px;border-radius:8px;}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;}

/* Home hero */
.hero{padding:8px 0 34px;}
.hero h1{font-size:42px;line-height:1.12;max-width:640px;}
.stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px;}
.stat-box{
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 20px;min-width:132px;
  box-shadow:var(--shadow);transition:transform .15s ease;
}
.stat-box:hover{transform:translateY(-2px);}
.stat-box .num{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--green-deep);}
.stat-box .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}

/* Lesson content blocks */
.step-label{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.step-label::after{content:"";flex:1;height:1px;background:var(--line);}
.code-block{
  background:linear-gradient(165deg,#152A1E,#0E1F16);color:#EFF6F1;border-radius:12px;padding:18px 20px;
  font-family:'JetBrains Mono',monospace;font-size:14px;overflow-x:auto;white-space:pre;
  margin:10px 0;border:1px solid rgba(143,217,174,.14);box-shadow:0 6px 18px -10px rgba(23,61,42,.5);
}
.code-block .tag{color:#8FD9AE;font-weight:600;}
.code-block .attr{color:#F2C572;}
.code-block .str{color:#F29E7C;}

.line-explain{border-left:3px solid var(--green); padding:9px 0 9px 15px;margin:10px 0;background:var(--green-tint);border-radius:0 10px 10px 0;}
.line-explain code{background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;font-size:13px;}

.analogy-box{background:var(--gold-tint);border:1px solid #EBD9A8;border-radius:12px;padding:15px 18px;margin:16px 0;font-size:14.5px;position:relative;padding-left:44px;}
.analogy-box::before{content:"💡";position:absolute;left:14px;top:14px;font-size:16px;}
.analogy-box b{color:var(--gold);}

.callout{border-radius:11px;padding:13px 16px;font-size:14px;margin:12px 0;display:flex;gap:10px;align-items:flex-start;font-weight:500;}
.callout.ok{background:var(--green-tint);color:var(--green-deep);border:1px solid rgba(47,111,78,.18);}
.callout.bad{background:var(--coral-tint);color:#9A3418;border:1px solid rgba(228,87,46,.18);}
.callout.hint{background:var(--blue-tint);color:#213A9E;border:1px solid rgba(52,87,213,.16);}

/* Editor */
.editor-wrap{display:flex;gap:16px;margin-top:12px;}
@media (max-width:760px){.editor-wrap{flex-direction:column;}}
.editor-pane, .preview-pane{flex:1;min-width:0;border-radius:12px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);}
.pane-head{
  background:#F2EFE4;padding:9px 14px;font-size:11.5px;font-family:'JetBrains Mono',monospace;font-weight:600;
  color:var(--ink-soft);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);
}
textarea.code-input{
  width:100%;min-height:230px;border:none;padding:16px;font-size:13.5px;resize:vertical;
  background:linear-gradient(165deg,#152A1E,#0E1F16);color:#EFF6F1;outline:none;line-height:1.65;
}
iframe.preview-frame{width:100%;min-height:230px;border:none;background:#fff;}
.fullscreen-editor{position:fixed;inset:0;background:var(--bg);z-index:999;padding:24px;overflow-y:auto;}

/* Exercises */
.opt-btn{
  display:block;width:100%;text-align:left;padding:12px 16px;border:1.5px solid var(--line);border-radius:11px;
  background:#fff;margin-bottom:9px;font-size:14px;font-weight:500;transition:border-color .15s ease, background .15s ease, transform .1s ease;
}
.opt-btn:hover:not([disabled]){border-color:var(--green);background:var(--green-tint);transform:translateX(2px);}
.opt-btn.correct{border-color:var(--green);background:var(--green-tint);color:var(--green-deep);font-weight:700;}
.opt-btn.wrong{border-color:var(--coral);background:var(--coral-tint);color:#9A3418;}

/* Dashboard */
.progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0;}
.level-progress-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
.level-progress-row:last-child{border-bottom:none;}
.mini-bar-track{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
.mini-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-bright));border-radius:5px;transition:width .5s ease;}
.badge{
  display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--gold-tint),#FCEFCB);
  border:1px solid #EBD9A8;color:#7A5B0E;padding:8px 14px;border-radius:22px;font-size:13px;font-weight:600;
  margin:4px 7px 4px 0;box-shadow:0 2px 6px -2px rgba(201,151,31,.35);
}
.badge.locked{opacity:.4;background:#F1EFE7;border-color:var(--line);color:var(--ink-soft);box-shadow:none;}

/* Glossary */
.gloss-item{border-bottom:1px solid var(--line);padding:16px 0;}
.gloss-item:hover .gloss-term{color:var(--green-bright);}
.gloss-term{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--green-deep);font-size:15px;transition:color .15s ease;}

/* Chat */
.chat-log{max-height:380px;overflow-y:auto;padding:6px 2px;margin-bottom:14px;}
.chat-msg{padding:11px 15px;border-radius:14px;margin-bottom:9px;font-size:14px;max-width:85%;line-height:1.55;}
.chat-msg.user{background:var(--blue-tint);margin-left:auto;color:#1D2E80;border-bottom-right-radius:4px;}
.chat-msg.bot{background:var(--green-tint);color:var(--green-deep);border-bottom-left-radius:4px;}
.chat-input-row{display:flex;gap:9px;}
.chat-input-row input{flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;transition:border-color .15s ease;}
.chat-input-row input:focus{border-color:var(--green);outline:none;}
.faq-chip{font-size:12px;padding:6px 12px;border:1px solid var(--line);border-radius:18px;background:#fff;margin:3px 5px 0 0;transition:.15s;}
.faq-chip:hover{border-color:var(--green);background:var(--green-tint);}

.toast{
  position:fixed;bottom:24px;right:24px;background:linear-gradient(135deg,var(--green-deep),#0F2E1D);color:#fff;
  padding:13px 20px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lift);z-index:1200;
  opacity:0;transform:translateY(10px);transition:.3s cubic-bezier(.2,.8,.2,1);
}
.toast.show{opacity:1;transform:translateY(0);}

.pill-nav{display:flex;justify-content:space-between;margin-top:28px;}
.hidden{display:none !important;}

/* ---- Confeti ---- */
.confetti-piece{
  position:fixed;top:38%;width:9px;height:14px;z-index:1400;border-radius:2px;pointer-events:none;
  animation:confetti-fall 1.7s cubic-bezier(.25,.46,.45,.94) forwards;
}
@keyframes confetti-fall{
  0%{transform:translate(0,0) rotate(0deg);opacity:1;}
  100%{transform:translate(calc(var(--dx)*160px), 62vh) rotate(var(--rot));opacity:0;}
}

/* ---- Popup de insignia / subida de nivel ---- */
.badge-overlay{
  position:fixed;inset:0;background:rgba(15,25,20,.55);z-index:1500;display:flex;align-items:center;justify-content:center;
  animation:overlay-in .2s ease;backdrop-filter:blur(2px);
}
@keyframes overlay-in{from{opacity:0;}to{opacity:1;}}
.badge-popup{
  background:#fff;border-radius:20px;padding:30px 36px;text-align:center;width:280px;
  box-shadow:0 30px 60px -15px rgba(0,0,0,.4);animation:popup-in .45s cubic-bezier(.2,1.4,.4,1);
  border:3px solid var(--gold);position:relative;
}
.badge-popup.rarity-bronce{border-color:#B08D57;}
.badge-popup.rarity-plata{border-color:#9AA5B1;}
.badge-popup.rarity-oro{border-color:#D4AF37;box-shadow:0 0 0 6px rgba(212,175,55,.15), 0 30px 60px -15px rgba(0,0,0,.4);}
@keyframes popup-in{0%{transform:scale(.6) translateY(30px);opacity:0;}100%{transform:scale(1) translateY(0);opacity:1;}}
.badge-popup-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft);font-weight:700;margin-bottom:10px;}
.badge-popup-icon{font-size:56px;line-height:1;margin-bottom:10px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));animation:icon-pop .6s ease .1s both;}
@keyframes icon-pop{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.15) rotate(6deg);}100%{transform:scale(1) rotate(0);}}
.badge-popup-name{font-family:'Fraunces',serif;font-weight:700;font-size:19px;margin-bottom:6px;}
.badge-popup-desc{font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
.badge-popup-rarity{font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:14px;opacity:.6;}

/* ---- HUD tipo juego (sidebar) ---- */
.hud{background:rgba(0,0,0,.18);border-radius:14px;padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.08);}
.hud-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.hud-row:last-child{margin-bottom:0;}
.hud-avatar{
  width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#8FD9AE,#3457D5);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-family:'Fraunces',serif;color:#0F2E1D;flex-shrink:0;font-size:15px;
}
.hud-stats{font-size:11.5px;color:#AFD4BE;line-height:1.5;}
.hud-stats b{color:#fff;font-size:13px;}
.hud-mini{display:flex;gap:12px;font-size:11.5px;color:#BFDCC9;}
.hud-mini span{display:flex;align-items:center;gap:4px;}
.league-next{font-size:10.5px;color:#AFD4BE;margin-top:6px;}
.daily-goal-row{display:flex;justify-content:space-between;font-size:11px;color:#D6E9DD;margin-top:11px;font-weight:600;}
.daily-bar{height:5px;margin-top:5px;}
.daily-fill{background:linear-gradient(90deg,#F2D27E,#E4572E);}

/* ---- Mapa de niveles tipo juego ---- */
.level-map{position:relative;padding:20px 6px 10px;}
.level-map-path{position:relative;display:flex;flex-direction:column;gap:0;}
.map-node-row{display:flex;align-items:center;gap:18px;position:relative;padding:14px 4px;animation:node-in .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0) * 90ms);}
@keyframes node-in{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:translateY(0);}}
.map-node-row.zig1{margin-left:34px;}
.map-node-row.zig2{margin-left:64px;}
@media (max-width:760px){.map-node-row.zig1,.map-node-row.zig2{margin-left:10px;}}
.map-node-row:not(:last-child)::after{
  content:"";position:absolute;left:33px;bottom:-4px;width:3px;height:26px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 12px);
}
.map-node{
  width:68px;height:68px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:28px;position:relative;box-shadow:0 6px 14px -4px rgba(0,0,0,.25);border:4px solid #fff;cursor:pointer;
  transition:transform .15s ease;
}
.map-node:hover{transform:scale(1.06) rotate(-2deg);}
.map-node.locked{filter:grayscale(1);opacity:.55;cursor:default;}
.map-node.locked:hover{transform:none;}
.map-node.next-up{animation:next-pulse 1.8s ease-in-out infinite;}
@keyframes next-pulse{0%,100%{box-shadow:0 6px 14px -4px rgba(0,0,0,.25),0 0 0 0 rgba(72,166,114,.45);}50%{box-shadow:0 6px 14px -4px rgba(0,0,0,.25),0 0 0 9px rgba(72,166,114,0);}}
.next-up-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;background:var(--green-tint);color:var(--green-deep);padding:2px 7px;border-radius:6px;letter-spacing:.05em;vertical-align:middle;margin-left:6px;}
.map-node-lock{position:absolute;bottom:-4px;right:-4px;background:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.2);}
.map-node-info{flex:1;}
.map-node-title{font-weight:700;font-size:15.5px;font-family:'Fraunces',serif;}
.map-node-sub{font-size:12.5px;color:var(--ink-soft);}
.map-stars{margin-top:3px;font-size:13px;letter-spacing:2px;}
.map-stars .on{color:var(--gold);}
.map-stars .off{color:var(--line);}

/* ---- Grid de insignias tipo logros de juego ---- */
.achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
.achv-card{
  border-radius:14px;padding:16px 12px;text-align:center;background:#fff;border:2px solid var(--line);
  transition:transform .15s ease;
}
.achv-card.unlocked{transform:none;}
.achv-card.unlocked:hover{transform:translateY(-3px);}
.achv-card.unlocked.rarity-bronce{border-color:#B08D57;background:linear-gradient(180deg,#fff,#FBF3E8);}
.achv-card.unlocked.rarity-plata{border-color:#9AA5B1;background:linear-gradient(180deg,#fff,#F3F5F7);}
.achv-card.unlocked.rarity-oro{border-color:#D4AF37;background:linear-gradient(180deg,#fff,#FBF2D6);box-shadow:0 0 0 4px rgba(212,175,55,.12);}
.achv-card.locked{opacity:.5;filter:grayscale(.4);}
.achv-icon{font-size:30px;margin-bottom:8px;}
.achv-name{font-size:12.5px;font-weight:700;margin-bottom:3px;}
.achv-desc{font-size:11px;color:var(--ink-soft);}
.achv-rarity{font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-top:6px;opacity:.55;}

/* Acentos por nivel — cada nivel tiene identidad de color propia */
.accent-chip{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:4px 10px;border-radius:7px;letter-spacing:-.01em;}
.diff-chip{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;letter-spacing:.02em;vertical-align:middle;}
.diff-green{background:var(--green-tint);color:var(--green-deep);}
.diff-gold{background:var(--gold-tint);color:#7A5B0E;}
.diff-coral{background:var(--coral-tint);color:var(--coral-deep);}
.chip-green{background:var(--green-tint);color:var(--green-deep);}
.chip-blue{background:var(--blue-tint);color:#1D2E80;}
.chip-gold{background:var(--gold-tint);color:#7A5B0E;}
.chip-coral{background:var(--coral-tint);color:var(--coral-deep);}
.eyebrow-green{background:var(--green-tint);color:var(--green-deep);border-color:rgba(47,111,78,.18);}
.eyebrow-blue{background:var(--blue-tint);color:#1D2E80;border-color:rgba(52,87,213,.18);}
.eyebrow-gold{background:var(--gold-tint);color:#7A5B0E;border-color:rgba(201,151,31,.22);}
.eyebrow-coral{background:var(--coral-tint);color:var(--coral-deep);border-color:rgba(228,87,46,.18);}
.eyebrow-green::before{color:var(--green);}
.eyebrow-blue::before{color:var(--blue);}
.eyebrow-gold::before{color:var(--gold);}
.eyebrow-coral::before{color:var(--coral);}
.level-card{border-left:5px solid var(--line);}
.level-card.lc-green{border-left-color:var(--green);}
.level-card.lc-blue{border-left-color:var(--blue);}
.level-card.lc-gold{border-left-color:var(--gold);}
.level-card.lc-coral{border-left-color:var(--coral);}

/* Hero: demo dividido código + vista previa real */
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:#12281B;color:#8FD9AE;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;padding:6px 13px;border-radius:20px;margin-bottom:18px;}
.hero-badge::before{content:"●";color:#48A672;font-size:8px;animation:pulse-dot 1.8s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.3;}}
.hero-watermark{
  position:absolute;right:-10px;top:-30px;font-family:'JetBrains Mono',monospace;font-size:180px;font-weight:700;
  color:rgba(47,111,78,.05);z-index:0;pointer-events:none;line-height:1;user-select:none;
}
.hero-wrap{position:relative;overflow:hidden;}
.hero-demo{display:flex;gap:16px;margin:22px 0 28px;position:relative;z-index:1;}
@media (max-width:760px){.hero-demo{flex-direction:column;}}
.hero-demo-pane{flex:1;min-width:0;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-lift);border:1px solid var(--line);}
.hero-demo-head{padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;display:flex;align-items:center;gap:8px;}
.hero-demo-head .dots{display:flex;gap:5px;}
.hero-demo-head .dots span{width:8px;height:8px;border-radius:50%;display:inline-block;}
.hero-code-panel{background:linear-gradient(165deg,#152A1E,#0E1F16);}
.hero-code-panel .hero-demo-head{background:rgba(0,0,0,.2);color:#8FD9AE;}
.hero-code-panel pre{margin:0;padding:18px 20px;color:#EFF6F1;font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.75;white-space:pre-wrap;min-height:150px;}
.hero-preview-panel .hero-demo-head{background:#F2EFE4;color:var(--ink-soft);}
.hero-preview-panel iframe{width:100%;min-height:150px;border:none;background:#fff;display:block;}
.typing-cursor{display:inline-block;width:7px;height:15px;background:#8FD9AE;margin-left:1px;vertical-align:middle;animation:blink 0.9s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

/* ---- Cuenta en la nube ---- */
.account-hud{margin:2px 0 12px;}
.account-row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:#D6E9DD;padding:2px 6px 7px;}
.account-name{display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.account-status{font-family:'JetBrains Mono',monospace;font-size:9.5px;flex-shrink:0;margin-left:8px;}
.status-syncing{color:#F2D27E;}
.status-synced{color:#8FD9AE;}
.status-error{color:#F5A488;}
.status-no-account{color:#8FB89E;}
.account-btn{
  display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;border-radius:10px;
  background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.25);color:#D6E9DD;
  font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s ease;
}
.account-btn:hover{background:rgba(255,255,255,.13);}

.auth-popup{
  background:#fff;border-radius:20px;padding:30px 32px;text-align:left;width:320px;max-width:88vw;
  box-shadow:0 30px 60px -15px rgba(0,0,0,.4);animation:popup-in .3s cubic-bezier(.2,1.4,.4,1);
  border:1px solid var(--line);position:relative;
}
.auth-close{position:absolute;top:14px;right:14px;background:none;border:none;font-size:16px;color:var(--ink-soft);cursor:pointer;line-height:1;}
.auth-input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-top:10px;font-family:inherit;}
.auth-error{background:var(--coral-tint);color:var(--coral-deep);font-size:12.5px;padding:9px 11px;border-radius:8px;margin-top:10px;line-height:1.4;}

/* ---- Track de ligas ---- */
.league-track{display:flex;align-items:center;flex-wrap:wrap;gap:0;}
.league-step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:66px;opacity:.4;transition:opacity .2s ease;}
.league-step.reached{opacity:1;}
.league-step.current .league-step-icon{box-shadow:0 0 0 5px rgba(72,166,114,.16);transform:scale(1.1);}
.league-step-icon{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;border:3px solid #fff;box-shadow:0 4px 10px -4px rgba(0,0,0,.25);transition:transform .15s ease;}
.league-step-name{font-size:11.5px;font-weight:700;margin-top:2px;}
.league-step-xp{font-size:9.5px;color:var(--ink-soft);font-family:'JetBrains Mono',monospace;}
.league-step-line{flex:1;height:3px;background:var(--line);min-width:16px;border-radius:2px;margin-bottom:26px;}
.league-step-line.filled{background:linear-gradient(90deg,var(--green-bright),var(--green));}
.league-popup .badge-popup-label, .league-popup .badge-popup-name, .league-popup .badge-popup-desc{position:relative;z-index:1;}
</style>

<body>

<div id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase (solo Authentication + Firestore, para sincronizar el progreso entre dispositivos) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
/* =====================================================================
   APRENDE HTML — plataforma educativa de una sola página
   Estado en memoria + localStorage con fallback seguro (try/catch)
   ===================================================================== */

/* ---------- Persistencia segura (local) ---------- */
const STORAGE_KEY = "aprendeHTML_progreso_v1";
let memoryFallback = {}; // si localStorage falla, guardamos aquí (dura la sesión)
function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){
    memoryFallback = JSON.parse(JSON.stringify(state));
    console.warn("No se pudo usar localStorage, guardando solo en memoria de esta sesión.", e);
  }
  syncToCloud();
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* sigue abajo */ }
  return memoryFallback && memoryFallback.xp !== undefined ? memoryFallback : null;
}

/* =====================================================================
   Cuenta en la nube (Firebase) — progreso sincronizado entre dispositivos
   ---------------------------------------------------------------------
   CÓMO ACTIVARLO (una sola vez, gratis):
   1. Ve a https://console.firebase.google.com y crea un proyecto.
   2. Compilación → Authentication → pestaña "Sign-in method" → activa
      el proveedor "Correo electrónico/contraseña".
   3. Compilación → Firestore Database → "Crear base de datos" (modo
      producción, elige la región más cercana a Panamá).
   4. En Firestore, pestaña "Reglas", reemplaza todo por esto y publica:

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /progreso/{uid} {
              allow read, write: if request.auth != null && request.auth.uid == uid;
            }
          }
        }

   5. Ícono de engranaje → "Configuración del proyecto" → baja a
      "Tus apps" → clic en el ícono web </> → registra la app.
   6. Firebase te muestra un objeto firebaseConfig: cópialo y pégalo
      abajo, reemplazando el de ejemplo. ¡Listo!
   Mientras no lo configures, la app sigue funcionando 100% normal,
   guardando solo en este navegador (como hasta ahora).
   ===================================================================== */
const firebaseConfig = {
  apiKey: "PEGA_AQUI_TU_API_KEY",
  authDomain: "PEGA_AQUI_TU_PROYECTO.firebaseapp.com",
  projectId: "PEGA_AQUI_TU_PROYECTO",
  storageBucket: "PEGA_AQUI_TU_PROYECTO.appspot.com",
  messagingSenderId: "000000000000",
  appId: "PEGA_AQUI_TU_APP_ID"
};
const CLOUD_ENABLED = firebaseConfig.apiKey !== "PEGA_AQUI_TU_API_KEY";
let cloudAuth=null, cloudDb=null, currentUser=null, cloudSyncTimer=null, cloudStatus="no-account"; // no-account | syncing | synced | error

if(CLOUD_ENABLED && typeof firebase !== "undefined"){
  try{
    firebase.initializeApp(firebaseConfig);
    cloudAuth = firebase.auth();
    cloudDb = firebase.firestore();
    cloudAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    cloudAuth.onAuthStateChanged(async (user)=>{
      currentUser = user;
      if(user){
        cloudStatus = "syncing";
        renderSidebar();
        try{
          const doc = await cloudDb.collection("progreso").doc(user.uid).get();
          if(doc.exists && doc.data() && doc.data().state){
            state = doc.data().state;
            if(!state.flags) state.flags = JSON.parse(JSON.stringify(defaultState.flags));
            if(!state.streak) state.streak = JSON.parse(JSON.stringify(defaultState.streak));
          }else{
            await cloudDb.collection("progreso").doc(user.uid).set({state, username:user.displayName||"", updatedAt:Date.now()});
          }
          cloudStatus = "synced";
          updateStreak();
          render();
        }catch(e){
          console.warn("No se pudo cargar el progreso de la nube.", e);
          cloudStatus = "error";
          renderSidebar();
        }
      }else{
        cloudStatus = "no-account";
        renderSidebar();
      }
    });
  }catch(e){ console.warn("No se pudo iniciar Firebase.", e); }
}

function usernameToEmail(u){ return u.trim().toLowerCase()+"@estudiantes.aprendehtml.app"; }

function syncToCloud(){
  if(!cloudAuth || !currentUser) return;
  cloudStatus = "syncing";
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(()=>{
    cloudDb.collection("progreso").doc(currentUser.uid).set({state, username:currentUser.displayName||"", updatedAt:Date.now()})
      .then(()=>{ cloudStatus="synced"; renderSidebar(); })
      .catch((e)=>{ cloudStatus="error"; renderSidebar(); console.warn("No se pudo sincronizar con la nube.", e); });
  }, 1200);
}

function accountStatusLabel(){
  if(cloudStatus==="syncing") return "guardando…";
  if(cloudStatus==="synced") return "sincronizado";
  if(cloudStatus==="error") return "sin conexión";
  return "";
}

function openAuthModal(mode){
  document.getElementById("auth-overlay")?.remove();
  const overlay = document.createElement("div");
  overlay.className = "badge-overlay";
  overlay.id = "auth-overlay";
  overlay.innerHTML = renderAuthModal(mode || "login");
  document.body.appendChild(overlay);
}
function closeAuthModal(){ document.getElementById("auth-overlay")?.remove(); }
function renderAuthModal(mode){
  const isLogin = mode==="login";
  return `<div class="auth-popup">
    <button class="auth-close" onclick="closeAuthModal()">✕</button>
    <div class="badge-popup-label">${isLogin?"Iniciar sesión":"Crear cuenta"}</div>
    <h3 style="margin-bottom:4px;">${isLogin?"Bienvenido de nuevo":"Guarda tu progreso en la nube"}</h3>
    <p style="font-size:13px;color:var(--ink-soft);margin-top:0;">${isLogin?"Ingresa con tu usuario y contraseña para continuar donde lo dejaste, en cualquier dispositivo.":"Crea un usuario y contraseña para no perder tu progreso al cambiar de computadora o celular."}</p>
    <div id="auth-error" class="auth-error hidden"></div>
    <input id="auth-username" type="text" placeholder="Nombre de usuario" class="auth-input" autocomplete="username">
    <input id="auth-password" type="password" placeholder="Contraseña" class="auth-input" autocomplete="${isLogin?'current-password':'new-password'}" onkeydown="if(event.key==='Enter')${isLogin?'submitLogin()':'submitRegister()'}">
    ${isLogin?'':'<input id="auth-password2" type="password" placeholder="Repite la contraseña" class="auth-input" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')submitRegister()">'}
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="${isLogin?'submitLogin()':'submitRegister()'}">${isLogin?"Entrar":"Crear cuenta"}</button>
    <div style="text-align:center;font-size:12.5px;margin-top:12px;color:var(--ink-soft);">
      ${isLogin?'¿No tienes cuenta? <a href="#" onclick="openAuthModal(\'register\');return false;">Regístrate</a>':'¿Ya tienes cuenta? <a href="#" onclick="openAuthModal(\'login\');return false;">Inicia sesión</a>'}
    </div>
    <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px;" onclick="closeAuthModal()">Continuar sin cuenta</button>
  </div>`;
}
function showAuthError(msg){
  const el = document.getElementById("auth-error");
  if(!el) return;
  el.textContent = msg;
  el.classList.remove("hidden");
}
function validUsername(u){ return /^[a-zA-Z0-9_.-]{3,20}$/.test(u); }
async function submitRegister(){
  if(!CLOUD_ENABLED){ showAuthError("La nube todavía no está configurada. Avísale a tu profesor."); return; }
  const username = (document.getElementById("auth-username").value||"").trim();
  const pass = document.getElementById("auth-password").value;
  const pass2 = document.getElementById("auth-password2").value;
  if(!validUsername(username)){ showAuthError("El usuario debe tener 3 a 20 letras, números, puntos o guiones, sin espacios."); return; }
  if(pass.length<6){ showAuthError("La contraseña debe tener al menos 6 caracteres."); return; }
  if(pass!==pass2){ showAuthError("Las contraseñas no coinciden."); return; }
  try{
    const cred = await cloudAuth.createUserWithEmailAndPassword(usernameToEmail(username), pass);
    await cred.user.updateProfile({displayName: username});
    await cloudDb.collection("progreso").doc(cred.user.uid).set({state, username, updatedAt:Date.now()});
    closeAuthModal();
    showToast(`✅ Cuenta creada. ¡Bienvenido, ${username}!`);
  }catch(e){ showAuthError(authErrorMessage(e)); }
}
async function submitLogin(){
  if(!CLOUD_ENABLED){ showAuthError("La nube todavía no está configurada. Avísale a tu profesor."); return; }
  const username = (document.getElementById("auth-username").value||"").trim();
  const pass = document.getElementById("auth-password").value;
  if(!username || !pass){ showAuthError("Escribe tu usuario y contraseña."); return; }
  try{
    await cloudAuth.signInWithEmailAndPassword(usernameToEmail(username), pass);
    closeAuthModal();
    showToast("✅ Sesión iniciada. Sincronizando tu progreso…");
  }catch(e){ showAuthError(authErrorMessage(e)); }
}
function authErrorMessage(e){
  const code = e && e.code;
  if(code==="auth/email-already-in-use") return "Ese nombre de usuario ya está en uso.";
  if(code==="auth/invalid-email") return "Ese nombre de usuario no es válido.";
  if(code==="auth/wrong-password"||code==="auth/invalid-credential") return "Usuario o contraseña incorrectos.";
  if(code==="auth/user-not-found") return "No existe una cuenta con ese usuario.";
  if(code==="auth/weak-password") return "La contraseña es muy débil (mínimo 6 caracteres).";
  if(code==="auth/network-request-failed") return "Sin conexión a internet. Intenta de nuevo.";
  return "Ocurrió un error. Intenta de nuevo.";
}
function logoutUser(){
  if(cloudAuth) cloudAuth.signOut();
  cloudStatus = "no-account";
  showToast("Sesión cerrada. Tu progreso sigue guardado en este dispositivo.");
  renderSidebar();
}

const defaultState = {
  page:"home",
  levelId:null, lessonIndex:0,
  completedLessons:{}, // {lessonId:true}
  xp:0,
  badges:{}, // {badgeId:true}
  diagnosticDone:false,
  editorSaved:"<!DOCTYPE html>\n<html>\n  <head><title>Mi proyecto libre</title></head>\n  <body>\n    <h1>¡Escribe lo que quieras aquí!</h1>\n  </body>\n</html>",
  chat:[],
  flags:{glossary:false, chat:false, freeEditor:false, downloaded:false, noHintSpot:false, perfectMCQ:false, diagnostic:false, fullscreen:false},
  streak:{count:0, lastDate:null},
  daily:{date:null, count:0, target:1, totalReached:0}
};
let state = loadState() || JSON.parse(JSON.stringify(defaultState));
if(!state.flags) state.flags = JSON.parse(JSON.stringify(defaultState.flags));
if(!state.streak) state.streak = JSON.parse(JSON.stringify(defaultState.streak));
if(!state.daily) state.daily = JSON.parse(JSON.stringify(defaultState.daily));

function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(state.streak.lastDate === today) return;
  if(state.streak.lastDate){
    const prev = new Date(state.streak.lastDate);
    const diffDays = Math.round((new Date(today) - prev)/86400000);
    state.streak.count = diffDays===1 ? state.streak.count+1 : 1;
  }else{
    state.streak.count = 1;
  }
  state.streak.lastDate = today;
  saveState();
}
function playerLevel(){ return Math.floor(state.xp/100)+1; }
function xpIntoLevel(){ return state.xp%100; }

/* ---------- Ligas (rangos de jugador según XP) ---------- */
const LEAGUES = [
  {id:"bronce",   name:"Bronce",   icon:"🥉", min:0,   grad:"linear-gradient(145deg,#CD9B5D,#8A6435)"},
  {id:"plata",    name:"Plata",    icon:"🥈", min:150, grad:"linear-gradient(145deg,#C9D2DA,#78838F)"},
  {id:"oro",      name:"Oro",      icon:"🥇", min:400, grad:"linear-gradient(145deg,#F0D264,#A9821A)"},
  {id:"diamante", name:"Diamante", icon:"💎", min:800, grad:"linear-gradient(145deg,#8FE3F0,#1C8FA3)"},
];
function leagueForXP(xp){ let l=LEAGUES[0]; for(const lg of LEAGUES){ if(xp>=lg.min) l=lg; } return l; }
function currentLeague(){ return leagueForXP(state.xp); }
function nextLeague(){ const cur=currentLeague(); return LEAGUES[LEAGUES.indexOf(cur)+1] || null; }
function leagueProgressPct(){
  const cur=currentLeague(), nxt=nextLeague();
  if(!nxt) return 100;
  return Math.round(((state.xp-cur.min)/(nxt.min-cur.min))*100);
}

/* ---------- Meta diaria ---------- */
function ensureDaily(){
  const today = new Date().toISOString().slice(0,10);
  if(state.daily.date !== today){ state.daily.date = today; state.daily.count = 0; }
}
function registerDailyProgress(){
  ensureDaily();
  state.daily.count += 1;
  if(state.daily.count === state.daily.target){
    state.daily.totalReached = (state.daily.totalReached||0) + 1;
    awardXP(10);
    return true;
  }
  return false;
}

/* ---------- Dificultad de lecciones (calculada según su posición en el nivel) ---------- */
function lessonDifficulty(lvl, idx){
  const ratio = (idx+1)/lvl.lessons.length;
  if(ratio<=0.4) return {label:"Fácil", color:"green"};
  if(ratio<=0.75) return {label:"Media", color:"gold"};
  return {label:"Difícil", color:"coral"};
}
const HARD_LESSON_IDS = LEVELS.flatMap(lvl=>lvl.lessons.filter((l,idx)=>lessonDifficulty(lvl,idx).label==="Difícil").map(l=>l.id));

function levelComplete(s, levelId){
  const lvl = LEVELS.find(l=>l.id===levelId);
  if(!lvl) return false;
  return lvl.lessons.every(l=>s.completedLessons[l.id]);
}
function totalLessons(){ return LEVELS.reduce((a,l)=>a+l.lessons.length,0); }
function completedCount(){ return Object.keys(state.completedLessons).length; }

function awardXP(n){ state.xp += n; }
function checkBadges(){
  const newly=[];
  BADGES.forEach(b=>{
    if(!state.badges[b.id] && b.cond(state)){
      state.badges[b.id]=true;
      newly.push(b);
    }
  });
  return newly;
}
function completeLesson(lessonId){
  if(state.completedLessons[lessonId]){ renderSidebar(); return; }
  state.completedLessons[lessonId]=true;
  const prevLevel = playerLevel();
  const prevLeague = currentLeague();
  awardXP(15);
  const dailyReached = registerDailyProgress();
  const leveledUp = playerLevel() > prevLevel;
  const league = currentLeague();
  const leagueUp = league.id !== prevLeague.id;
  const nb = checkBadges();
  saveState();
  const queue = [];
  if(leveledUp) queue.push(()=>showLevelUp(playerLevel()));
  if(leagueUp) queue.push(()=>showLeagueUp(league));
  if(dailyReached) queue.push(()=>showDailyGoalPopup());
  nb.forEach(b=> queue.push(()=>showBadgePopup(b)));
  if(queue.length){ queue.forEach((fn,i)=> setTimeout(fn, i*1700)); }
  else{ showToast("✨ +15 XP — ¡Lección completada!"); }
  renderSidebar();
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}
function triggerFlag(name, xpBonus){
  if(state.flags[name]) return;

  const nb = checkBadges();
  saveState();
  nb.forEach((b,i)=> setTimeout(()=>showBadgePopup(b), i*1600));

}

  const colors=["#8FD9AE","#3457D5","#F2C572","#E4572E","#48A672"];
  for(let i=0;i<26;i++){
    const p = document.createElement("div");
    p.className="confetti-piece";
    p.style.left = (45+Math.random()*10)+"%";
    p.style.background = colors[i%colors.length];
    p.style.setProperty("--dx", (Math.random()*2-1).toFixed(2));
    p.style.setProperty("--rot", Math.floor(Math.random()*360)+"deg");

}

      <div class="code-block">${les.example}</div>
      ${les.lineByLine ? `<div class="step-label" style="margin-top:16px;">3 · Explicación línea por línea</div>
        ${les.lineByLine.map(l=>`<div class="line-explain"><code>${l.code}</code><div style="margin-top:4px;">${l.expl}</div></div>`).join("")}` : ""}
    </div>`;
  }

  html += `<div class="card" id="challenge-card">
    <div class="step-label">${les.example ? "4" : "2"} · Desafío</div>
    ${renderChallenge(les)}
    <div id="challenge-feedback"></div>
  </div>`;

  html += `<div class="pill-nav">
    <button class="btn btn-ghost" onclick="go('level',{levelId:'${lvl.id}'})">← Volver al nivel</button>
    <button class="btn btn-primary" id="next-lesson-btn" onclick="nextLesson()" ${isDone?"":"disabled"}>Siguiente lección →</button>
  </div>`;
  return html;
}

function renderChallenge(les){
  const c = les.challenge;
  if(c.type==="mcq"){
    return `<p>${c.q}</p>` + c.options.map((o,i)=>`<button class="opt-btn" onclick="answerMCQ(${i})">${o}</button>`).join("");
  }
  if(c.type==="fill"){
    return `<p>${c.q}</p>
    <div style="display:flex;gap:8px;"><input id="fill-input" type="text" style="flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:14px;" placeholder="Escribe tu respuesta">
    <button class="btn btn-primary btn-sm" onclick="answerFill()">Comprobar</button></div>`;
  }
  if(c.type==="order"){
    return `<p>${c.q}</p>
    <div id="order-list">${c.items.map((it,i)=>`<div class="opt-btn" draggable="false" data-idx="${i}" style="cursor:default;">${it}</div>`).join("")}</div>
    <p style="font-size:12.5px;color:var(--ink-soft);">Usa los botones para mover cada línea hacia arriba o abajo hasta lograr el orden correcto.</p>
    <div id="order-controls"></div>
    <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="answerOrder()">Comprobar orden</button>`;
  }
  if(c.type==="spot"){
    return `<p>${c.q}</p><div class="code-block">${c.buggyCode}</div>
    <button class="btn btn-ghost btn-sm" onclick="revealHint('spot')">💡 ¿Necesitas una pista?</button>
    <div id="spot-hint"></div>
    <div style="margin-top:10px;"><input id="spot-input" type="text" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:13px;" placeholder="Escribe el código correcto"></div>
    <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="answerSpot()">Comprobar</button>`;
  }
  if(c.type==="editor"){
    return `<p>${c.q}</p>
    <div class="editor-wrap">
      <div class="editor-pane">
        <div class="pane-head"><span>editor.html</span></div>
        <textarea class="code-input" id="lesson-editor">${c.starter}</textarea>
      </div>
      <div class="preview-pane">
        <div class="pane-head"><span>vista previa</span></div>
        <iframe class="preview-frame" id="lesson-preview"></iframe>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-sm" onclick="runLessonEditor()">▶ Ejecutar</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('lesson-editor').value=\`${c.starter.replace(/`/g,"\\`")}\`;runLessonEditor();">↺ Reiniciar</button>
      <button class="btn btn-ghost btn-sm" onclick="checkLessonEditor()">✓ Comprobar desafío</button>
    </div>`;
  }
  return "";
}

function wireLessonEditor(){
  const ta = document.getElementById("lesson-editor");
  if(ta){ runLessonEditor(); ta.addEventListener("input", debounce(runLessonEditor, 400)); }
}
function runLessonEditor(){
  const ta = document.getElementById("lesson-editor");
  const frame = document.getElementById("lesson-preview");
  if(ta && frame) frame.srcdoc = ta.value;
}
function checkLessonEditor(){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  const code = document.getElementById("lesson-editor").value;
  const ok = les.challenge.check(code);
  giveFeedback(ok, les.challenge.feedbackOk, les.challenge.feedbackBad);
  if(ok) completeLesson(les.id), enableNext();
}

function answerMCQ(i){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  const btns = document.querySelectorAll("#challenge-card .opt-btn");
  const ok = i===les.challenge.correct;
  btns.forEach((b,idx)=>{
    b.onclick=null;
    if(idx===les.challenge.correct) b.classList.add("correct");
    if(idx===i && !ok) b.classList.add("wrong");
  });
  giveFeedback(ok, les.challenge.feedbackOk, les.challenge.feedbackBad);
  if(ok) completeLesson(les.id), enableNext();
}
function answerFill(){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  const val = document.getElementById("fill-input").value.trim().toLowerCase();
  const ok = val === les.challenge.answer.toLowerCase();
  giveFeedback(ok, les.challenge.feedbackOk, les.challenge.feedbackBad);
  if(ok) completeLesson(les.id), enableNext();
}
let orderState = null;
function answerOrder(){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  // Comparación simple: si aún no reordenó manualmente, evaluamos el orden mostrado por defecto vs correctOrder,
  // así que ofrecemos botones de mover.
  giveFeedback(false, les.challenge.feedbackOk, "Usa los botones ↑ ↓ (debajo de cada línea) para reordenar, luego vuelve a comprobar.");
}
let hintUsed = false;
function revealHint(kind){
  hintUsed = true;
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  document.getElementById("spot-hint").innerHTML = `<div class="callout hint">💡 ${les.challenge.bugHint}</div>`;
}
function answerSpot(){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  const les = lvl.lessons[state.lessonIndex];
  const val = document.getElementById("spot-input").value.replace(/\s+/g," ").trim();
  const target = les.challenge.fixed.replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/\s+/g," ").trim();
  const ok = val.replace(/</g,"<").replace(/>/g,">") === target || val === les.challenge.fixed;
  giveFeedback(ok, les.challenge.feedbackOk, les.challenge.feedbackBad);
  if(ok){ completeLesson(les.id); enableNext(); if(!hintUsed) triggerFlag('noHintSpot',10); }
}
function giveFeedback(ok, okMsg, badMsg){
  const box = document.getElementById("challenge-feedback");
  box.innerHTML = `<div class="callout ${ok?'ok':'bad'}">${ok?'✅':'❌'} ${ok?okMsg:badMsg}</div>`;
}
function enableNext(){
  const btn = document.getElementById("next-lesson-btn");
  if(btn) btn.disabled=false;
}
function nextLesson(){
  const lvl = LEVELS.find(l=>l.id===state.levelId);
  if(state.lessonIndex+1 < lvl.lessons.length){
    go('lesson',{lessonIndex:state.lessonIndex+1});
  }else{
    go('level',{levelId:lvl.id});
  }
}

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const pct = Math.round((completedCount()/totalLessons())*100);
  const earned = Object.keys(state.badges).length;
  const league = currentLeague();
  const nxt = nextLeague();
  const dailyPct = Math.min(100, Math.round((state.daily.count/state.daily.target)*100));
  const dailyDone = state.daily.count >= state.daily.target;
  return `<span class="eyebrow">🏆 SALA DE TROFEOS</span>
  <h1>Panel del jugador</h1>
  <div class="stat-row">
    <div class="stat-box"><div class="num">Nv. ${playerLevel()}</div><div class="lbl">nivel de jugador</div></div>
    <div class="stat-box"><div class="num">${state.xp}</div><div class="lbl">puntos XP</div></div>
    <div class="stat-box"><div class="num">${completedCount()}/${totalLessons()}</div><div class="lbl">lecciones completadas</div></div>
    <div class="stat-box"><div class="num">🔥 ${state.streak.count||0}</div><div class="lbl">racha de días</div></div>
  </div>
  <div class="card">
    <h3>${league.icon} Liga ${league.name}</h3>
    <p class="lead" style="margin-bottom:16px;">${nxt ? `Te faltan <b>${nxt.min - state.xp}</b> XP para subir a la liga ${nxt.name} ${nxt.icon}.` : `Llegaste a la liga más alta. ¡Sigue sumando XP e insignias!`}</p>
    <div class="league-track">
      ${LEAGUES.map((lg,i)=>{
        const reached = state.xp >= lg.min;
        const isCurrent = lg.id===league.id;
        const lineFilled = i<LEAGUES.length-1 && state.xp>=LEAGUES[i+1].min;
        return `<div class="league-step ${reached?'reached':''} ${isCurrent?'current':''}">
          <div class="league-step-icon" style="background:${reached?lg.grad:'var(--line)'};">${lg.icon}</div>
          <div class="league-step-name">${lg.name}</div>
          <div class="league-step-xp">${lg.min} XP</div>
        </div>${i<LEAGUES.length-1?`<div class="league-step-line ${lineFilled?'filled':''}"></div>`:''}`;
      }).join("")}
    </div>
  </div>
  <div class="card">
    <h3>🎯 Meta diaria</h3>
    <p class="lead" style="margin-bottom:10px;">${dailyDone?'¡Ya cumpliste la meta de hoy! Vuelve mañana para seguir sumando.':`Completa ${state.daily.target} lección(es) hoy y gana +10 XP extra.`}</p>
    <div class="mini-bar-track" style="max-width:280px;"><div class="mini-bar-fill" style="width:${dailyPct}%;background:linear-gradient(90deg,#F2D27E,#E4572E);"></div></div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-top:6px;">${Math.min(state.daily.count,state.daily.target)}/${state.daily.target} hoy · cumplida ${state.daily.totalReached||0} vez/veces en total</div>
  </div>
  <div class="card">
    <h3>Avance por nivel</h3>
    ${LEVELS.map(lvl=>{
      const done = lvl.lessons.filter(l=>state.completedLessons[l.id]).length;
      return `<div class="level-progress-row">
        <span class="accent-chip chip-${lvl.color}">${lvl.icon} &lt;${lvl.tag}&gt;</span>
        <div style="flex:1;">${lvl.title}</div>
        <div class="mini-bar-track"><div class="mini-bar-fill" style="width:${(done/lvl.lessons.length)*100}%"></div></div>
        <div style="font-size:12.5px;color:var(--ink-soft);width:40px;text-align:right;">${done}/${lvl.lessons.length}</div>
      </div>`;
    }).join("")}
  </div>
  <div class="card">
    <h3>Insignias · ${earned}/${BADGES.length} desbloqueadas</h3>
    <div class="mini-bar-track" style="max-width:260px;margin-bottom:14px;"><div class="mini-bar-fill" style="width:${(earned/BADGES.length)*100}%;background:linear-gradient(90deg,var(--gold),#EBCB6B);"></div></div>
    <div class="achv-grid">
    ${BADGES.map(b=>{
      const on = !!state.badges[b.id];
      return `<div class="achv-card ${on?'unlocked':'locked'} rarity-${b.rarity}">
        <div class="achv-icon">${on?b.icon:'🔒'}</div>
        <div class="achv-name">${b.name}</div>
        <div class="achv-desc">${on?b.desc:'???'}</div>
        <div class="achv-rarity">${b.rarity}</div>
      </div>`;
    }).join("")}
    </div>
  </div>`;
}

/* ---------- Glosario ---------- */
function renderGlossary(){
  triggerFlag('glossary',5);
  return `<span class="eyebrow">GLOSARIO</span>
  <h1>Términos clave</h1>
  <input id="gloss-search" type="text" placeholder="Buscar un término..." style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;margin-bottom:16px;" oninput="filterGlossary()">
  <div id="gloss-list"></div>`;
}
function filterGlossary(){
  const q = (document.getElementById("gloss-search").value||"").toLowerCase();
  const list = GLOSSARY.filter(g=>g.term.toLowerCase().includes(q) || g.def.toLowerCase().includes(q));
  document.getElementById("gloss-list").innerHTML = list.map(g=>`
    <div class="gloss-item">
      <div class="gloss-term">${g.term}</div>
      <div>${g.def}</div>
      <div style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">Ejemplo: ${g.ex}</div>
    </div>`).join("") || `<p style="color:var(--ink-soft);">No se encontraron términos.</p>`;
}

/* ---------- Editor libre ---------- */
function renderFreeEditor(){
  return `<span class="eyebrow">MODO PROYECTO LIBRE</span>
  <h1>Editor</h1>
  <p class="lead">Escribe HTML libremente y observa el resultado al instante. Tu código se guarda automáticamente en este navegador.</p>
  <div class="editor-wrap">
    <div class="editor-pane">
      <div class="pane-head"><span>proyecto.html</span>
        <span>
          <button class="btn btn-ghost btn-sm" onclick="copyCode('free-editor')">Copiar</button>
          <button class="btn btn-ghost btn-sm" onclick="downloadCode('free-editor')">Descargar .html</button>
        </span>
      </div>
      <textarea class="code-input" id="free-editor" style="min-height:420px;">${state.editorSaved}</textarea>
    </div>
    <div class="preview-pane">
      <div class="pane-head"><span>vista previa</span>
        <button class="btn btn-ghost btn-sm" onclick="toggleFullscreen()">⛶ Pantalla completa</button>
      </div>
      <iframe class="preview-frame" id="free-preview" style="min-height:420px;"></iframe>
    </div>
  </div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="runFreeEditor()">▶ Ejecutar</button>
    <button class="btn btn-ghost" onclick="clearFreeEditor()">🗑 Limpiar</button>
    <button class="btn btn-ghost" onclick="resetFreeEditor()">↺ Reiniciar plantilla</button>
  </div>`;
}
function wireEditor(taId, frameId){
  const ta = document.getElementById(taId);
  if(!ta) return;
  runFreeEditor();
  ta.addEventListener("input", debounce(()=>{ runFreeEditor(); state.editorSaved = ta.value; saveState(); }, 500));
}
function runFreeEditor(){
  const ta = document.getElementById("free-editor");
  const frame = document.getElementById("free-preview");
  if(ta && frame){ frame.srcdoc = ta.value; triggerFlag('freeEditor',5); }
}
function clearFreeEditor(){
  document.getElementById("free-editor").value = "";
  runFreeEditor();
}
function resetFreeEditor(){
  document.getElementById("free-editor").value = defaultState.editorSaved;
  runFreeEditor();
}
function copyCode(taId){
  const ta = document.getElementById(taId);
  navigator.clipboard.writeText(ta.value).then(()=>showToast("Código copiado ✅")).catch(()=>showToast("No se pudo copiar automáticamente. Selecciona y copia manualmente."));
}
function downloadCode(taId){
  const ta = document.getElementById(taId);
  const blob = new Blob([ta.value], {type:"text/html"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "mi-pagina.html";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Archivo .html descargado ✅");
  triggerFlag('downloaded',10);
}
function toggleFullscreen(){
  const frame = document.getElementById("free-preview");
  if(frame.requestFullscreen){ frame.requestFullscreen(); triggerFlag('fullscreen',5); }
  else showToast("Pantalla completa no disponible en este navegador.");
}

/* ---------- Chat / Pregunta a tu profesor ---------- */
function renderChat(){
  return `<span class="eyebrow">PREGUNTA A TU PROFESOR</span>
  <h1>Asistente de dudas</h1>
  <p class="lead">Escribe tu duda en palabras simples. Este asistente responde con reglas predefinidas sobre los temas del curso (no es una IA conectada a internet).</p>
  <div class="card">
    <div class="chat-log" id="chat-log">
      ${state.chat.length===0 ? `<div class="chat-msg bot">¡Hola! Soy tu profesor de HTML. Pregúntame, por ejemplo: "¿qué es un atributo?" o "¿por qué mi código no funciona?".</div>` :
        state.chat.map(m=>`<div class="chat-msg ${m.role}">${m.text}</div>`).join("")}
    </div>
    <div class="chat-input-row">
      <input id="chat-input" type="text" placeholder="Escribe tu pregunta..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="btn btn-primary btn-sm" onclick="sendChat()">Enviar</button>
    </div>
    <div style="margin-top:10px;">
      ${["¿Qué es un atributo?","¿Diferencia entre div y section?","Mi código no funciona","¿Qué es href?"].map(q=>`<button class="faq-chip" onclick="document.getElementById('chat-input').value='${q}';sendChat();">${q}</button>`).join("")}
    </div>
  </div>`;
}
function sendChat(){
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if(!text) return;
  state.chat.push({role:"user", text});
  const answer = answerFAQ(text);
  state.chat.push({role:"bot", text:answer});
  input.value="";
  saveState();
  render();
  triggerFlag('chat',5);
  const log = document.getElementById("chat-log");
  if(log) log.scrollTop = log.scrollHeight;
}
function answerFAQ(text){
  const lower = text.toLowerCase();
  for(const item of FAQ){
    if(item.kw.some(k=>lower.includes(k))) return item.a;
  }
  return "Buena pregunta. Todavía no tengo una respuesta preparada para eso exactamente, pero puedes revisar el <b>Glosario</b> para conceptos clave, o intenta preguntarlo de otra forma, por ejemplo mencionando el nombre de la etiqueta o el problema que ves en pantalla.";
}

/* ---------- Helpers ---------- */
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

/* ---------- Init ---------- */
updateStreak();
ensureDaily();
render();
</script>
